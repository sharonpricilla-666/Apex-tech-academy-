<div class="card" style="max-width:500px;margin:auto;">

<h1>User Login</h1>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter Email"
required
style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:none;">

<input
type="password"
id="password"
placeholder="Enter Password"
required
style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:none;">

<label>

<input type="checkbox">

Remember Me

</label>

<br><br>

<button class="btn" type="submit">

Login

</button>

</form>

<br>

<a href="#">Forgot Password?</a>

<hr style="margin:30px 0;">

<h2>Admin Login</h2>

<form id="adminForm">

<input
type="email"
placeholder="Admin Email"
required
style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:none;">

<input
type="password"
placeholder="Admin Password"
required
style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:none;">

<button class="btn" type="submit">

Admin Login

</button>

</form>
